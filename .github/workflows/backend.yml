name: backend

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - contracts/**
  pull_request:
    paths:
      - backend/**
      - contracts/**

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        working-directory: backend
        run: ./gradlew test
