name: android

on:
  push:
    branches: [main]
    paths:
      - android/**
      - contracts/**
  pull_request:
    paths:
      - android/**
      - contracts/**

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint
        working-directory: android
        run: ./gradlew :app:lintDebug

      - name: Assemble debug
        working-directory: android
        run: ./gradlew :app:assembleDebug

      # Firebase App Distribution 업로드 — FIREBASE_APP_ID / FIREBASE_SERVICE_CREDENTIALS
      # 시크릿을 레포에 등록한 뒤 주석을 해제해서 활성화한다 (사람 체크리스트 항목).
