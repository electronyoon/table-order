server:
  port: ${PORT:8080}

spring:
  application:
    name: table-order-backend
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:table_order}
    username: ${PGUSER:table_order}
    password: ${PGPASSWORD:table_order}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
