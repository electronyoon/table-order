server:
  port: ${PORT:8080}

spring:
  application:
    name: table-order-backend
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:table_order}
    username: ${PGUSER:table_order}
    password: ${PGPASSWORD:table_order}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  # 관리자 API(/admin/**) 정적 Bearer 토큰. 배포 환경에서는 반드시 ADMIN_TOKEN 환경변수로 덮어써야 한다.
  admin-token: ${ADMIN_TOKEN:local-dev-admin-token}
